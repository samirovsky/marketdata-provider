openapi: 3.1.0
info:
  title: Market Data
  version: v2
  description: Quotes, candles and instruments for listed securities.
servers:
  - url: https://marketdata-api.vercel.app/v2
security:
  - apiKey: []
paths:
  /instruments:
    get:
      operationId: listInstruments
      summary: Every listed instrument.
      responses:
        "200":
          description: The instruments
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Instrument" }
  /quotes/{symbol}:
    get:
      operationId: getQuote
      summary: The latest quote of an instrument.
      parameters:
        - { name: symbol, in: path, required: true, schema: { type: string, example: TLX } }
      responses:
        "200":
          description: The quote
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Quote" }
        "404":
          description: Unknown symbol
  /instruments/{symbol}/candles:
    get:
      operationId: listCandles
      x-api-lock-renamed-from: GET /candles/{symbol}
      summary: OHLCV candles, oldest first.
      parameters:
        - { name: symbol, in: path, required: true, schema: { type: string, example: TLX } }
        - { name: interval, in: query, required: true, schema: { type: string, enum: ["1m", "1h", "1d", "1w"] } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 500, default: 30 } }
      responses:
        "200":
          description: The candles
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Candle" }
  /fx/{pair}:
    get:
      operationId: getFxRate
      summary: The latest exchange rate of a currency pair, e.g. USDEUR.
      parameters:
        - { name: pair, in: path, required: true, schema: { type: string, example: USDEUR } }
        - name: account
          in: query
          required: true
          description: The Market Data account FX usage is metered against (new in v2).
          schema: { type: string, example: acct_demo }
      responses:
        "200":
          description: The rate
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FxRate" }
        "404":
          description: Unknown pair
components:
  securitySchemes:
    apiKey: { type: apiKey, in: header, name: X-Marketdata-Key }
  schemas:
    Instrument:
      type: object
      required: [symbol, name, exchange, currency]
      properties:
        symbol: { type: string, example: TLX }
        name: { type: string }
        exchange: { type: string, enum: [XTLN, XORB] }
        currency: { type: string, enum: [USD, EUR] }
    Quote:
      type: object
      required: [symbol, last, currency, volume, as_of]
      properties:
        symbol: { type: string, example: TLX }
        last:
          type: number
          x-api-lock-renamed-from: price
          description: Last traded price, in major units of the currency.
        currency: { type: string, enum: [USD, EUR] }
        volume: { type: integer, description: Shares traded today. }
        as_of:
          type: string
          format: date-time
          x-api-lock-renamed-from: timestamp
    FxRate:
      type: object
      required: [pair, rate, as_of]
      properties:
        pair: { type: string, example: USDEUR }
        rate: { type: number, description: Units of the quote currency per unit of the base currency. }
        as_of: { type: string, format: date-time }
    Candle:
      type: object
      required: [t, o, h, l, c, v]
      properties:
        t: { type: string, format: date-time }
        o: { type: number }
        h: { type: number }
        l: { type: number }
        c: { type: number }
        v: { type: integer }
