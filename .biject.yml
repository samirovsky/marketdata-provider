# biject configuration for the Market Data API (REST). The service also speaks GraphQL and
# gRPC (graphql/, proto/); the live demo releases the REST API only.
#
# Every version lives side by side (openapi/v1.yaml, openapi/v2.yaml, ...) and the service
# serves all of them. This entry names the *released* version: releasing v2 is the PR that
# points it at openapi/v2.yaml.
apis:
  - name: marketdata
    protocol: http
    specs: [openapi/v2.yaml]
    lock: api.lock.http.yaml
    versioning: { style: path, path_template: "/{version}" }
gate: release
release_tag: "v*"
owners: ["@samirovsky"]
